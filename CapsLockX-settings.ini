; CapsLockX settings
; [Keys] 修改后约 0.5 秒内自动生效，无需重载脚本
; 托盘「重载脚本」仅在整个程序异常时使用

[Global]
loadingAnimation=1
loadingAnimationMinMs=700
autostart=0
errorTrayTip=0
hotkeyStormDiag=1
; 内置远程客户端始终暂停 Caps 层；1=同时启用下方 ini 额外匹配，0=仅内置列表
remoteLayerSuspend=1
; 额外匹配（分号分隔），用于浏览器远程等内置未覆盖场景
remoteForegroundExes=
remoteForegroundClasses=
remoteForegroundTitleHints=

[Keys]
; 轻点 Caps：none=不切换大写灯(推荐)；toggleCapsLock=切换大写灯(易导致输入法异常)
press_caps=none
